<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>OSU!Manager!</title>
    <link
      rel="icon"
      type="image/svg+xml"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 256 256' fill='none'%3E%3Crect x='10' y='10' width='236' height='236' rx='56' fill='%23111318' stroke='%23FFFFFF' stroke-opacity='0.16' stroke-width='5'/%3E%3Ccircle cx='77' cy='128' r='36' stroke='%23FFFFFF' stroke-width='20'/%3E%3Cpath d='M 147 167 L 147 89 L 181 138 L 215 89 L 215 167' stroke='%23FFFFFF' stroke-width='20' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E"
    />
    <script>
      (function () {
        var validThemes = ['dark', 'stone', 'midnight', 'forest', 'light', 'paper', 'latte', 'sakura'];
        try {
          var t = localStorage.getItem('osu4k-theme');
          if (t && validThemes.indexOf(t) !== -1) {
            document.documentElement.dataset.theme = t;
          } else {
            document.documentElement.dataset.theme = 'light';
          }
          var rawFs = localStorage.getItem('osu4k-font-scale');
          var fs = rawFs !== null && rawFs !== '' ? Number(rawFs) : 1.2;
          if (!isFinite(fs) || fs < 0.85 || fs > 1.25) fs = 1.2;
          document.documentElement.style.setProperty('--ui-font-scale', String(Math.round(fs * 100) / 100));
        } catch (e) {
          document.documentElement.dataset.theme = 'light';
          document.documentElement.style.setProperty('--ui-font-scale', '1.2');
        }
      })();
    </script>
  </head>
  <body class="bg-canvas text-ink antialiased">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
